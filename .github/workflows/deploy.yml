name: Deploy to EC2

on:
  push:
    branches: [dev_tamil]  # Trigger on dev_tamil branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 30s
        script: |
          # Navigate to the correct directory
          cd /home/ubuntu/app
          
          # Clone the repository if it doesn't exist
          if [ ! -d "TaskManagement" ]; then
            git clone https://github.com/Tamil-kumaran2002/TaskManagement.git
          fi
          
          # Go into the project directory
          cd TaskManagement
          
          # Pull the latest changes
          git fetch
          git checkout dev_tamil
          git reset --hard origin/dev_tamil
          
          # Install dependencies
          npm install
          
          # Build the application
          npm run build
          
          # Run database migrations
          npx typeorm migration:run
          
          # Install PM2 globally if not installed
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi
          
          # Restart the application
          pm2 delete TaskManagement || true
          NODE_ENV=production pm2 start dist/main.js --name "TaskManagement"
          pm2 save
          
          # Save PM2 process list
          pm2 save
