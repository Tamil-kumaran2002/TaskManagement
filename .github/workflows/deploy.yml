name: Deploy to EC2

on:
  push:
    branches: [dev_tamil]  # Trigger on dev_tamil branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        port: 22
        timeout: 30s
        script: |
          cd /home/ec2-user/TaskManagement  # Verify this is the correct path on your EC2
          git fetch
          git checkout dev_tamil
          git pull origin dev_tamil
          npm ci
          npm run build  # Runs 'nest build' for NestJS projects
          pm2 restart all
